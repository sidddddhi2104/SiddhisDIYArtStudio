<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">
</head>
<body>

<section class="section-padding">

    <div class="section-title">
        <h2>Edit Product</h2>
    </div>

    <form method="POST"
          action="/update-product/{{ product[0] }}"
          class="glass-card"
          style="padding:40px;">

        <input type="text"
               name="name"
               value="{{ product[1] }}"
               required>

        <input type="text"
               name="category"
               value="{{ product[2] }}"
               required>

        <input type="number"
               name="price"
               value="{{ product[3] }}"
               required>

        <textarea name="description">{{ product[4] }}</textarea>

        <button type="submit"
                class="primary-btn">

            Update Product

        </button>

    </form>

</section>

</body>
</html>
